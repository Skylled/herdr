id = "codex"
version = "2026.10.16.1"
min_engine_version = 3
updated_at = "2026-10-16T00:00:00Z"

[[rules]]
id = "queued_question_working"
state = "working"
priority = 1150
region = "before_current_prompt_marker"
visible_working = true
# Codex 0.159.0 sets Action Required for unanswered async questions even while
# its turn continues. Only a live timer + queued section + collapsed question
# count overrides that title; later response markers and real dialogs veto it.
# Navigation bindings are optional and configurable, so do not require them.
regex = ['(?m)^(?:[•◦][ \t]+)?[^\s›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?: • [^\r\n]+? to interrupt)?\)(?: · [^\r\n]*)?\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*\r?\n|\r?\n)*•[ \t]+Queued follow-up inputs\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*\r?\n|\r?\n)*[ \t]*\? [0-9]+ questions?(?: · [^\r\n]*)?(?:\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*)?)*\s*\z']
not = [
  { line_regex = ['^(?:[•◦][ \t]+)?Reconnect failed — check the endpoint, then relaunch \([0-9hms ]+\)$'] },
  { contains = ["press enter to confirm"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
  # Approval/permission dialogs (the strings live_prompt_blocked and weak_blocker
  # already treat as blockers). A dialog must never read as working.
  { contains = ["would you like to"] },
  { contains = ["do you want to"] },
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["yes, proceed"] },
  { contains = ["waiting for permission"] },
  { contains = ["esc to cancel"] },
  { contains = ["enter to select"] },
  { contains = ["enter to submit"] },
]

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

[[rules]]
id = "startup_update"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
# Codex 0.158 changed the header from "Update available! A -> B" to
# "Update available · A → B" and the footer from "Press enter to continue" to
# "enter continue · esc skip". Keep both; the footer must still end the screen.
contains = ["Update now"]
regex = [
  'Update available(?:!|[ \t]+·)',
  'Skip\s+until\s+next\s+version',
  '(?:Press enter to continue|(?m:^[ \t]*)enter continue(?: · [^\r\n]*)?)\s*\z',
]

# These controls must end the detection buffer: the same lines in transcript
# history above a live composer or working timer are not an active menu.
# Support two-option Yes/No menus and Codex's three-option exec approval
# (Yes, proceed / Yes, and don't ask again / No, and tell Codex).
[[rules]]
id = "live_menu_blocked"
state = "blocked"
priority = 925
region = "whole_recent"
visible_blocker = true
any = [
  { regex = ['(?mi:^[ \t]*[›❯]?[ \t]*1\.[ \t]+Yes\b[^\r\n]*\r?\n(?:[ \t]*[›❯]?[ \t]*2\.[ \t]+Yes\b[^\r\n]*\r?\n[ \t]*[›❯]?[ \t]*3|[ \t]*[›❯]?[ \t]*2)\.[ \t]+No\b[^\r\n]*(?:\r?\n[ \t]*)*\z)'] },
  { regex = ['(?mi:^[ \t]*(?:(?:↑↓[ \t]+)?navigate[ \t]+·[ \t]+)?enter\s+select[ \t]+·[ \t]+esc\s+(?:close|back)[ \t]*(?:\r?\n[ \t]*)*\z)'] },
  { regex = ['(?mi-u:^[ \t]*enter\s+continue\s+·\s+esc\s+skip[ \t]*(?:\r?\n[ \t]*)*\z)'] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
# Sparkles can replace the space after ›. A later response marker makes that prompt stale.
not = [{ regex = ['(?m)^›[⠁⠂⠄⠈⠐⠠⡀⢀][^\n]*(?:\n(?:[^•■✗✓\n][^\n]*)?)*\z'] }]
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "before_current_prompt_marker"
visible_working = true
# Support animated and reduced-motion status, including dynamic activity labels.
# The interrupt hint can be remapped, unbound, or hidden, and queued inputs can
# sit below the status. Require the live timer suffix with no later response.
any = [{ contains = [" to interrupt)"] }, { contains = ["s)"] }]
regex = ['(?m)^(?:[•◦][ \t]+)?[^\s›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?: • [^\r\n]+? to interrupt)?\)(?: · [^\r\n]*)?(?:\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*|•[ \t]+(?:Queued\s+follow-up\s+inputs|Messages\s+to\s+be\s+submitted\s+after\s+next\s+tool\s+call(?:\s+\(press\s+[^\r\n]+?\s+to\s+interrupt\s+and\s+send\s+immediately\))?|Messages\s+to\s+be\s+submitted\s+at\s+end\s+of\s+turn)|›[⠁⠂⠄⠈⠐⠠⡀⢀][^\r\n]*)?)*\s*\z']
# A failed reconnect keeps its final elapsed timer but is no longer working.
not = [{ line_regex = ['^(?:[•◦][ \t]+)?Reconnect failed — check the endpoint, then relaunch \([0-9hms ]+\)$'] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]

# Archived live Codex 0.156.1 captures (2026-09-25): idle and working
# screens both retain this empty composer and model/path footer. Veto controls
# across the detection snapshot; stale controls can conservatively refuse idle.
# The higher-priority guards also prevent the retained OSC idle rule from
# bypassing these vetoes while this composer is visible.
# QL-390: permit only the optional shortcuts line and its warning summary.
# No generic footer continuation: arbitrary output and menu options must not
# become input-ready. Unrecognized composer tails also veto the OSC idle rule.

[[rules]]
id = "live_prompt_blocked"
state = "blocked"
priority = 650
region = "whole_recent"
visible_blocker = true
all = [{ regex = ['(?m)^›(?:[ \t]+|[\u2800-\u28FF])[ \t]*Ask Codex to do anything[ \t]*\r?$'] }]
any = [
  { regex = ['(?i-u:enter\s+to\s+submit)'] },
  { regex = ['(?i-u:press\s+enter\s+to\s+confirm)'] },
  { regex = ['(?i-u:esc\s+to\s+cancel)'] },
  { regex = ['(?i-u:enter\s+to\s+select)'] },
  { regex = ['(?i-u:allow\s+command\?)'] },
  { regex = ['(?i-u:do\s+you\s+want\s+to)'] },
  { regex = ['(?i-u:would\s+you\s+like\s+to)'] },
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { regex = ['(?i-u:waiting\s+for\s+permission)'] },
  { regex = ['(?i-u:action\s+required)'] },
  { regex = ['(?i-u:do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?)'] },
  { regex = ['(?i-u:Update\s+available(?:!|\s+·))'] },
  { regex = ['(?i-u:press\s+enter\s+to\s+continue)'] },
  { regex = ['(?i-u:esc\s+dismiss)'] },
  { regex = ['(?i-u:q\s+to\s+quit)'] },
  { regex = ['(?mi-u:^[ \t]*Question[ \t]+[0-9]+(?:[ \t]*/[ \t]*[0-9]+|[ \t]+of[ \t]+[0-9]+)(?:[ \t:]|$))'] },
]

[[rules]]
id = "live_prompt_busy"
state = "working"
priority = 450
region = "whole_recent"
visible_working = true
all = [{ regex = ['(?m)^›(?:[ \t]+|[\u2800-\u28FF])[ \t]*Ask Codex to do anything[ \t]*\r?$'] }]
any = [
  { regex = ['[\u2800-\u28FF\x{25D0}-\x{25D3}]'] },
  { regex = ['(■|⬝){4,}'] },
  { regex = ['(?i-u:\b(?:esc|ctrl\+c)(?:\s+again)?(?:\s+to)?\s+interrupt\b|\bto\s+interrupt\b)'] },
  { regex = ['(?m)^[ \t]*(?:[•◦][ \t]+)?[^ \t\r\n›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?:[^\r\n]*)?\)[^\r\n]*$'] },
  { regex = ['(?i-u:Queued\s+follow-up\s+inputs|Messages\s+to\s+be\s+submitted\s+(?:after\s+next\s+tool\s+call|at\s+end\s+of\s+turn)|edit\s+last\s+queued\s+message)'] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 200
region = "whole_recent"
visible_idle = true
regex = ['(?m)^›[ \t]+Ask Codex to do anything[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]{2,}[^›\r\n]+ · [^\s›][^›\r\n]*(?:\r?\n[ \t]*\?[ \t]+for shortcuts(?:[ \t]+⚠[ \t]+[0-9]+[ \t]+warnings?[ \t]+·[ \t]+f2 to view)?[ \t]*)?(?:\r?\n[ \t]*)*\z']
not = [
  # Unverified menus above the composer refuse idle without claiming a blocker.
  { regex = ['(?i-u:yes,\s+proceed)'] },
  { regex = ['(?mi:^[ \t]*[›❯][ \t]*[0-9]+\.[ \t])'] },
  { regex = ['[\u2800-\u28FF\x{25D0}-\x{25D3}]'] },
  { regex = ['(■|⬝){4,}'] },
  { regex = ['(?i-u:\b(?:esc|ctrl\+c)(?:\s+again)?(?:\s+to)?\s+interrupt\b|\bto\s+interrupt\b)'] },
  { regex = ['(?m)^[ \t]*(?:[•◦][ \t]+)?[^ \t\r\n›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?:[^\r\n]*)?\)[^\r\n]*$'] },
  { regex = ['(?i-u:Queued\s+follow-up\s+inputs|Messages\s+to\s+be\s+submitted\s+(?:after\s+next\s+tool\s+call|at\s+end\s+of\s+turn)|edit\s+last\s+queued\s+message)'] },
  { regex = ['(?i-u:enter\s+to\s+submit)'] },
  { regex = ['(?i-u:press\s+enter\s+to\s+confirm)'] },
  { regex = ['(?i-u:esc\s+to\s+cancel)'] },
  { regex = ['(?i-u:enter\s+to\s+select)'] },
  { regex = ['(?i-u:allow\s+command\?)'] },
  { regex = ['(?i-u:do\s+you\s+want\s+to)'] },
  { regex = ['(?i-u:would\s+you\s+like\s+to)'] },
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { regex = ['(?i-u:waiting\s+for\s+permission)'] },
  { regex = ['(?i-u:action\s+required)'] },
  { regex = ['(?i-u:do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?)'] },
  { regex = ['(?i-u:Update\s+available(?:!|\s+·))'] },
  { regex = ['(?i-u:press\s+enter\s+to\s+continue)'] },
  { regex = ['(?i-u:esc\s+dismiss)'] },
  { regex = ['(?i-u:q\s+to\s+quit)'] },
  { regex = ['(?mi-u:^[ \t]*Question[ \t]+[0-9]+(?:[ \t]*/[ \t]*[0-9]+|[ \t]+of[ \t]+[0-9]+)(?:[ \t:]|$))'] },
]

# A retained title cannot turn an unsupported composer tail into a prompt.
# This is local to the empty composer; the engine's known-agent fallback stays
# unchanged (Earshot refuses default_known_agent_idle_fallback).
[[rules]]
id = "live_prompt_unclassified"
state = "unknown"
priority = 150
region = "whole_recent"
regex = ['(?m)^›[ \t]+Ask Codex to do anything[ \t]*\r?$']
