id = "agy"
version = "2026.10.19.1"
min_engine_version = 1
updated_at = "2026-10-19T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]

# QL-378: the cached 2026.10.05.1 catalog lacks idle detection entirely.
# Keep this version newer than that cache and publish the same rules below.
# Evidence: real 1.3.3 PTY and Herdr detection captures on 2026-10-14.

# Modern dialogs end in paired navigation/action controls. The paired footer
# also recognises a tall dialog whose title has scrolled out of the snapshot.
# QL-416: precise permission names outrank the generic footer fallback.
# Current command/file evidence is captured; URL/tool variants are reconstructed
# from the shipped changelog's titles, and require the same live paired controls.
[[rules]]
id = "command_permission_prompt"
state = "blocked"
priority = 350
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["Run this command?", "navigate", "tab amend"]
line_regex = [
  '(?i)^[> \t]*1\. Yes, run command\b',
  '(?i)^[> \t]*[2-9][0-9]*\. No, cancel\b',
]
regex = ['(?im)^[ \t]*esc to cancel[^\r\n]*(?:\r?\n[ \t]*)*\z']

[[rules]]
id = "network_permission_prompt"
state = "blocked"
priority = 350
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["Allow access to this URL?", "navigate", "tab amend"]
line_regex = [
  '(?i)^[> \t]*1\. Yes, allow\b',
  '(?i)^[> \t]*[2-9][0-9]*\. No, deny\b',
]
regex = ['(?im)^[ \t]*esc to cancel[^\r\n]*(?:\r?\n[ \t]*)*\z']

[[rules]]
id = "tool_permission_prompt"
state = "blocked"
priority = 350
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["Allow calling this tool?", "navigate", "tab amend"]
line_regex = [
  '(?i)^[> \t]*1\. Yes, allow\b',
  '(?i)^[> \t]*[2-9][0-9]*\. No, deny\b',
]
regex = ['(?im)^[ \t]*esc to cancel[^\r\n]*(?:\r?\n[ \t]*)*\z']

[[rules]]
id = "permission_controls"
state = "blocked"
priority = 330
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "tab amend"]

[[rules]]
id = "question_controls"
state = "blocked"
priority = 320
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "esc skip"]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  # agy renders this footer hint as "ctrl+g edit command" (<=1.2.4) and
  # "ctrl+g edit/expand command" (1.2.5). Match edit..command on one line with a
  # short gap so a further wording change does not silently drop the branch.
  { contains = ["tab amend"], regex = ['(?i)\bedit\b[^\n]{0,32}\bcommand\b'] },
]

[[rules]]
id = "folder_trust_dialog"
state = "blocked"
priority = 310
region = "bottom_non_empty_lines(20)"
visible_blocker = true
# agy's startup modal: it cannot proceed without a keypress, so the pane is
# blocked, not idle. Gate on the question, then confirm the option list is
# really on screen so prose that merely mentions the modal cannot match.
# QL-390: captured on 1.3.5 at 28 columns; words wrap onto new rows.
regex = ['(?i)do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+project\?']
any = [
  { regex = ['(?i)yes,\s+i\s+trust\s+this\s+folder'] },
  { regex = ['(?i)no,\s+exit'] },
]

# QL-390: 1.3.5 file access uses a cancel footer, also used while working.
# Require the question AND actionable options; the footer alone is not blocked.
[[rules]]
id = "file_access_dialog"
state = "blocked"
priority = 350
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["allow access to this file?", "esc to cancel"]
regex = ['(?im)^[ \t]*esc to cancel[^\r\n]*(?:\r?\n[ \t]*)*\z']
line_regex = [
  '(?i)^[> \t]*[1-9][0-9]*\. Yes, allow access\s*$',
  '(?i)^[> \t]*[1-9][0-9]*\. No, deny access\s*$',
]

# 1.3.3 keeps the empty composer during a turn, replacing the shortcuts hint
# with an interrupt footer. This remains working between spinner redraws.
[[rules]]
id = "cancel_footer_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(2)"
visible_working = true
line_regex = ['(?i)^\s*(?:─{3,}\s*)?esc to cancel\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2801-\u28FF]+\s+\S']

[[rules]]
id = "background_tasks_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)·\s*[1-9][0-9]*\s+task']

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 50
region = "whole_recent"
visible_idle = true
# Based on agy 1.2.1/1.2.14 captures (QL-283), and real 1.3.3 captures
# (QL-378). A verbosity notice ABOVE the box is ordinary transcript content.
# QL-390: 1.3.5 truncates the mode placeholders to the terminal width.
# Match their invariant mode prefix inside the bordered composer, not their
# width-dependent description or shift+tab hint. Default mode stays empty.
# 1.3.5 may finish a turn while terminal tasks still run. Its input-ready
# composer then has a timestamped task list below the input border and another
# closing border; short panes collapse extra tasks into a "↓ N more" row.
# Match only those task rows, not arbitrary content in the box.
# Evidence: live 1.3.5 detection text/ANSI captures on 2026-10-15 (QL-390).
# The optional footer is the shortcuts hint or the cached permissions warning.
# The rule is anchored to the foot of the region (\z)
# and allows only that one footer line, so text typed below the box, any other
# footer, or prose containing rules cannot match. Mid-turn screens keep drawing
# the prompt box, so the not-gates veto active spinners, interrupt and cancel
# hints, task-count working hints, and approval dialogs. agy 1.2.14's changelog names
# its approval titles ("Run this command?", "Allow access to this URL?",
# "Allow calling this tool?"); their option labels are vetoed as well.
# Use the detection snapshot so vetoes above the last ten lines still apply.
regex = ['(?m)^[ \t]*─{20,}[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*>[ \t]*(?:(?:Auto mode:|Plan mode:|Accept-edits mode:)[^\r\n]*)?\r?\n(?:[ \t]*\r?\n)*[ \t]*─{20,}[ \t]*(?:\r?\n(?:[ \t]*●[ \t]+\[[0-9]{2}:[0-9]{2}:[0-9]{2}\][^\r\n]*\brunning[ \t]*\r?\n)+(?:[ \t]*↓[ \t]+[1-9][0-9]*[ \t]+more[ \t]*\r?\n)?[ \t]*─{20,}[ \t]*)?(?:\r?\n[ \t]*(?:\?[ \t]+for shortcuts\b|Global config\.json no(?:t found\.|\.{3}))[^\r\n]*)?(?:\r?\n[ \t]*)*\z']
not = [
  { regex = ['[\u2800-\u28FF\x{25D0}-\x{25D3}]'] },
  { regex = ['(?i-u:\b(?:esc|ctrl\+c)(?:\s+again)?(?:\s+to)?\s+interrupt\b)'] },
  { regex = ['(?i)\besc\s+to\s+cancel\b'] },
  { regex = ['(?i)·\s*[1-9][0-9]*\s+task'] },
  { contains = ["requesting permission for:"] },
  { contains = ["run this command?"] },
  { contains = ["allow access to this url?"] },
  { contains = ["allow access to this file?"] },
  { contains = ["allow calling this tool?"] },
  { contains = ["approve this action?"] },
  { contains = ["send input to this task?"] },
  { contains = ["do you want to proceed?"] },
  { contains = ["yes, allow"] },
  { contains = ["yes, accept this change"] },
  { contains = ["yes, send input"] },
  { contains = ["no, deny"] },
  { contains = ["tab amend"] },
  { contains = ["navigate", "esc skip"] },
  { contains = ["enter confirm"] },
  { contains = ["do you trust the contents of this project?"] },
  { contains = ["yes, i trust this folder"] },
]
